<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Crown Dark</title>
  <desc id="desc">jeweled crown on dark background</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12061f"/>
      <stop offset="0.5" stop-color="hsl(12 82% 22%)"/>
      <stop offset="1" stop-color="#05020a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="25%" r="65%">
      <stop offset="0" stop-color="#ffd75a" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#ff39d2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#55edff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <g opacity="0.2">
    <path d="M-100 680 C260 520 420 870 760 690 S1160 520 1300 650" fill="none" stroke="#55edff" stroke-width="18"/>
    <path d="M-80 160 C260 40 420 310 760 170 S1120 20 1300 120" fill="none" stroke="#ff39d2" stroke-width="12"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="120" y="120" width="960" height="560" rx="54" fill="rgba(0,0,0,0.34)" stroke="#ffd75a" stroke-width="5"/>
    <circle cx="235" cy="232" r="56" fill="#ffd75a" opacity="0.95"/>
    <text x="235" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="900" fill="#1b0a00">TML</text>
    <text x="600" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#fff8dc" letter-spacing="-2">Crown Dark</text>
    <text x="600" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#d9c68d">That’s My Lingo production asset</text>
    <text x="600" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#55edff">SVG fallback ready for live static deployment</text>
  </g>
